name: Build Windows

# Windows 安装包在 GitHub 的 Windows 机器上构建——Tauri 用系统 WebView + MSVC 链接，
# 无法在 macOS 上交叉编译出可用的 Windows 包。
#
# 两种触发：
#  - 推 v* tag：构建并把安装包传到该 tag 对应的 Release（Release 需已存在）。
#  - 手动跑（Actions → Build Windows → Run workflow）：留空 tag 只产出可下载的 artifact；
#    填已存在的 tag 则同时上传到那个 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "上传到这个已存在的 Release（留空＝只产出 artifact，不上传）"
        required: false
        default: ""

permissions:
  contents: write # 需要写 Release 资产

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 编译产物缓存：首次约 5-8 分钟，之后 2-3 分钟。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Build (tsc + vite + tauri bundle)
        run: npm run tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lithe-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # tag 推送用 github.ref_name；手动跑用输入框里的 tag。都没有则跳过。
      - name: Attach installers to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          $files = Get-ChildItem -Path `
            src-tauri/target/release/bundle/nsis/*.exe, `
            src-tauri/target/release/bundle/msi/*.msi
          Write-Host "Uploading to $env:TAG :"
          $files | ForEach-Object { Write-Host "  $($_.Name)" }
          gh release upload $env:TAG $files.FullName --clobber
